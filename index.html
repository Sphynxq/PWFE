<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hola mundo</title>
    <style>
        body { font-family: system-ui; text-align: center; padding: 2rem; }
        .contador { font-size: 2rem; margin: 1rem 0; color: #0d9488; }
        button { padding: 0.5rem 1.5rem; font-size: 1rem; cursor: pointer; border-radius: 8px; border: none; background: #0d9488; color: white; }
        button:hover { background: #760f0f; }
    </style>
</head>
<body>
    <h1>hola mundo</h1>
    <p class="contador"><span id="num">0</span> clics</p>
    <button type="button" onclick="contar()">Pulsar</button>
    <button type="button" onclick="document.getElementById('num').textContent = 0">Reiniciar</button>

    <script>
        function contar() {
            var n = document.getElementById('num');
            n.textContent = Number(n.textContent) + 1;
        }
    </script>
</body>
</html>
